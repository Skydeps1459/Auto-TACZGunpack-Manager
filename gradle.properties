# ===== 模组元信息 =====
mod_id=autotaczgunpackmanager
mod_name=Auto TACZ Gunpack Manager
mod_license=MIT
mod_version=0.1.0
mod_group_id=com.skydeps.autotacz
mod_authors=Skydeps
# 本文件按 ISO-8859-1 读取，中文必须用 \uXXXX 转义，直接粘中文会变乱码。
# 对应内容：批量管理 / 搜索 / 下载 TACZ 枪包
mod_description=\u6279\u91cf\u7ba1\u7406 / \u641c\u7d22 / \u4e0b\u8f7d TACZ \u67aa\u5305

# ===== 平台版本（Forge 1.20.1）=====
minecraft_version=1.20.1
minecraft_version_range=[1.20.1,1.21)
forge_version=47.4.29
forge_version_range=[47,)
loader_version_range=[47,)
mapping_channel=official
mapping_version=1.20.1

# ===== 前置模组：TACZ 本体 =====
# 版本号取 TACZ jar 的 Implementation-Version（如 1.1.8），
# 不带 "1.20.1-" 前缀——前缀只出现在文件名里，不是 mod 版本。
# 实测 1.1.4 / 1.1.6 / 1.1.8 / 1.2.0 均满足 [1.1.0,)，1.0.3 被正确拒绝。
tacz_version_range=[1.1.0,)

# ===== 构建 =====
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true