name: Build

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      # Forge 1.20.1 要求 Java 17。
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # 全量测试包含：
      #   - 核心逻辑单测（不启动 Minecraft）
      #   - packs.json 的字段自洽校验（防止改坏线上清单）
      # 需要本地 HTTP 服务的集成测试会自动跳过，不会误报失败。
      - name: Build with Gradle
        run: ./gradlew build --rerun-tasks

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: autotaczgunpackmanager
          path: build/libs/*.jar
          if-no-files-found: warn