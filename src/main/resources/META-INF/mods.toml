modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"
issueTrackerURL = "https://github.com/Skydeps1459/Auto-TACZGunpack-Manager/issues"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
description = '''${mod_description}'''

# Forge 1.20.1 的依赖声明使用 mandatory（布尔），而非 NeoForge 的 type 字段。
[[dependencies.${mod_id}]]
    modId = "forge"
    mandatory = true
    versionRange = "${forge_version_range}"
    ordering = "NONE"
    side = "BOTH"

[[dependencies.${mod_id}]]
    modId = "minecraft"
    mandatory = true
    versionRange = "${minecraft_version_range}"
    ordering = "NONE"
    side = "BOTH"

# TACZ 本体是必需前置：本模组管理的对象就是 tacz/ 目录下的枪包，
# 没有 TACZ 时枪包不会被游戏读取，功能无从谈起。
#
# versionRange 依据 TACZ jar 的 Implementation-Version（形如 1.1.8），
# 而非文件名里的 "1.20.1-1.1.8"。实测 1.1.4 / 1.1.6 / 1.1.8 / 1.2.0
# 均落入 [1.1.0,)，1.0.3 会被正确拒绝。若写成 [1.20.1-1.0,) 会把所有
# 真实版本判为不满足，导致游戏直接崩溃——这一点已用 Maven VersionRange 验证过。
[[dependencies.${mod_id}]]
    modId = "tacz"
    mandatory = true
    versionRange = "${tacz_version_range}"
    ordering = "AFTER"
    side = "BOTH"