plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

// 1.20.1 使用 Java 17
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
    withSourcesJar()
}

minecraft {
    mappings channel: mapping_channel, version: mapping_version

    // 让 runClient / runServer 使用独立工作目录，避免污染项目根
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        data {
            workingDirectory project.file('run-data')
            args '--mod', mod_id, '--all',
                    '--output', file('src/generated/resources/'),
                    '--existing', file('src/main/resources/')
        }
    }
}

// 让 runServer / runClient 能接收标准输入，便于脚本化执行命令
// （例如把 "taczpack list" 通过管道喂给 dev.bat server）。
// 默认 Gradle 的 JavaExec 不转发 stdin，服务端控制台命令无法从管道输入。
tasks.withType(JavaExec).configureEach {
    standardInput = System.in
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    mavenCentral()
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'skipped', 'failed'
        exceptionFormat = 'full'
    }
}

// 资源变量替换：mods.toml / pack.mcmeta 使用 gradle.properties 中的值
//
// 注意：gradle.properties 按 ISO-8859-1 读取（Gradle 遵循 java.util.Properties
// 规范），因此其中的中文必须写成 \\uXXXX 转义，否则会在读取阶段就变成乱码
// （"批" = E6 89 B9 被当成 Latin-1 解成 "æ¹"），后续如何设置编码都无法挽回。
// mod_description 已改成转义写法，不要直接粘中文进去。
def replaceProperties = [
        minecraft_version      : minecraft_version,
        minecraft_version_range: minecraft_version_range,
        forge_version          : forge_version,
        forge_version_range    : forge_version_range,
        loader_version_range   : loader_version_range,
        tacz_version_range     : tacz_version_range,
        mod_id                 : mod_id,
        mod_name               : mod_name,
        mod_license            : mod_license,
        mod_version            : mod_version,
        mod_authors            : mod_authors,
        mod_description        : mod_description
]

tasks.withType(ProcessResources).configureEach {
    inputs.properties replaceProperties
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// javadoc 同样必须显式指定 UTF-8。缺省它按平台编码（Windows 上是 GBK）读源码，
// 中文注释会被判为「不可映射字符」直接构建失败。
tasks.withType(Javadoc).configureEach {
    options.encoding = 'UTF-8'
    options.charSet = 'UTF-8'
    options.addStringOption('Xdoclint:none', '-quiet')
}

// ===== 开发用 TACZ 占位模组 =====
//
// 为什么需要它：
// TACZ 的 mixin 把 SRG 名硬编码在字节码里（如 @Shadow 字段 f_9743_），
// 而本项目用 official mappings。@Shadow 不走 refmap 重映射，因此真实 TACZ
// 在 dev 环境必然崩在 "InvalidMixinException @Shadow field f_9743_ was not
// located"。fg.deobf 也解决不了（@Shadow 名不会被重写）。
//
// 但本项目零处 import com.tacz（只操作 tacz/ 目录下的文件），所以 TACZ 只是
// 发布层面的前置。开发期用一个空壳 mod 满足 mandatory 声明即可。
//
// 生成物只写进 run/mods，不进 jar、不发布。
def taczStubDir = layout.buildDirectory.dir('tacz-stub')

tasks.register('generateTaczDevStub') {
    group = 'autotacz'
    description = '生成开发用 TACZ 占位模组，满足 mandatory 前置依赖'
    outputs.dir(taczStubDir)
    outputs.upToDateWhen { false }

    doLast {
        def outDir = taczStubDir.get().asFile
        def classDir = new File(outDir, 'classes')
        classDir.mkdirs()

        // 写入占位类源码
        def srcFile = new File(outDir, 'TaczDevStub.java')
        srcFile.parentFile.mkdirs()
        srcFile.text = '''package stub.tacz;

import net.minecraftforge.fml.common.Mod;
import org.slf4j.LoggerFactory;

/** 开发占位 mod：仅满足前置声明，不含任何 TACZ 逻辑。 */
@Mod("tacz")
public final class TaczDevStub {
    public TaczDevStub() {
        LoggerFactory.getLogger("tacz-dev-stub")
                .warn("TACZ 开发占位模组已加载：仅满足前置声明，不含真实 TACZ 功能");
    }
}
'''

        // 编译：javafmllanguage 提供 @Mod 注解，slf4j 提供日志
        // 必须用 release 而非 source/target：ant.javac 的 source/target 属性
        // 会被 Gradle 的 toolchain 覆盖，结果是 1.20.1 的 Java 17 运行时
        // 拒绝加载 class 版本 65（Java 21）的类。
        def cp = configurations.minecraft.asFileTree.files.collect { it.absolutePath }
        ant.javac(srcdir: outDir, destdir: classDir, encoding: 'UTF-8',
                includeantruntime: false, debug: true,
                release: '17') {
            classpath {
                cp.each { fileset(dir: new File(it).parent, includes: new File(it).name) }
            }
            compilerarg(line: '-proc:none')
        }

        // 打包成 jar
        def jarFile = new File(outDir, 'tacz-dev-stub.jar')
        def manifestFile = new File(outDir, 'MANIFEST.MF')
        manifestFile.text = '''Manifest-Version: 1.0
Implementation-Title: tacz-dev-stub
Implementation-Version: 1.1.8

'''
        def tomlFile = new File(outDir, 'mods.toml')
        tomlFile.text = '''modLoader = "javafml"
loaderVersion = "[47,)"
license = "MIT"

[[mods]]
modId = "tacz"
version = "1.1.8"
displayName = "TACZ (DEV STUB)"
description = \'\'\'
开发用占位模组，仅用于满足 Auto TACZ Gunpack Manager 的 mandatory 前置依赖。
不含任何 TACZ 代码或资源，请勿分发，也不要与真实 TACZ 同时放入 mods。
\'\'\'
'''
        ant.zip(destfile: jarFile) {
            fileset(dir: classDir, includes: 'stub/tacz/**/*.class')
            zipfileset(dir: outDir, includes: 'MANIFEST.MF', prefix: 'META-INF')
            zipfileset(dir: outDir, includes: 'mods.toml', prefix: 'META-INF')
        }

        // 放进 run/mods
        def modsDir = file('run/mods')
        modsDir.mkdirs()
        copy {
            from jarFile
            into modsDir
        }
        logger.lifecycle("已生成开发占位模组: ${modsDir}/tacz-dev-stub.jar")
    }
}

// runClient / runServer / runData 前自动准备占位模组，避免忘带前置而崩溃
tasks.matching { it.name in ['runClient', 'runServer', 'runData'] }.configureEach {
    dependsOn 'generateTaczDevStub'
}

jar {
    manifest {
        attributes([
                'Specification-Title'   : mod_id,
                'Specification-Vendor'  : mod_authors,
                'Specification-Version' : '1',
                'Implementation-Title'  : project.name,
                'Implementation-Version': project.jar.archiveVersion,
                'Implementation-Vendor' : mod_authors
        ])
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}